; ============================================================================
;  Tarea #6 - Sistemas Embebidos (FIEC - ESPOL)
;  Ejercicio 1: Gestion de Energia en el ESP32
; ============================================================================
;  Demuestra tres modos de bajo consumo en un solo firmware:
;    Light Sleep  -> la CPU se pausa, la RAM sobrevive, la ejecucion continua.
;    Deep Sleep   -> el chip reinicia, solo sobrevive la memoria RTC.
;    Hibernacion  -> se apaga incluso la memoria RTC.
; ============================================================================

[env:esp32dev]
; Version FIJADA a proposito. Sin fijarla, PlatformIO instala espressif32 7.x
; con ESP-IDF 6.0.1, cuyo binario no arranca en el simulador de Wokwi: la
; simulacion corre pero el chip nunca ejecuta nada y el monitor serial queda
; en blanco, ni siquiera con el volcado de la ROM. Con 5.4.0 (ESP-IDF 4.4.5)
; funciona. No quitar el @5.4.0 sin volver a comprobar la simulacion.
platform  = espressif32@5.4.0
board     = esp32dev
framework = espidf

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

; Fusiona bootloader + tabla de particiones + app en un unico merged.bin,
; que es lo que Wokwi necesita para arrancar el chip. Ver merge_firmware.py.
extra_scripts = post:merge_firmware.py

build_flags =
    ; --- LED RGB de estado (catodo comun) -------------------------------
    -D LED_ROJO_GPIO=25         ; RTC_GPIO6  - indica DEEP SLEEP
    -D LED_VERDE_GPIO=26        ; RTC_GPIO7  - indica FASE ACTIVA
    -D LED_AZUL_GPIO=27         ; RTC_GPIO17 - indica LIGHT SLEEP

    ; --- Boton de despertar externo (ext0) ------------------------------
    ;  DEBE ser un GPIO con funcion RTC. GPIO33 = RTC_GPIO8 (datasheet).
    ;  Se conecta a GND; el pull-up interno lo mantiene en alto en reposo.
    -D BOTON_WAKE_GPIO=33

    ; --- Tiempos del ciclo (ms / us) ------------------------------------
    -D T_ACTIVO_LARGO_MS=8000   ; trabajo antes del light sleep
    -D T_ACTIVO_CORTO_MS=4000   ; trabajo antes del deep sleep
    -D T_LIGHT_SLEEP_US=5000000 ; 5 s dormido en light sleep
    -D T_DEEP_SLEEP_US=10000000 ; 10 s dormido en deep sleep

    ; --- Ciclos antes de pasar a hibernacion ----------------------------
    -D CICLOS_ANTES_HIBERNAR=3
